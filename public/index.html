<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySpot AI </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <h2>✦StuduSpot AI</h2>
      <button id="newChat">+ Жаңа чат</button>
      <p>Сенің жеке AI көмекшің</p>
    </aside>

    <main class="main">
      <header>
        <h3>StudySpot AI</h3>
        <span>● Online</span>
      </header>

      <section class="chat" id="chat">
        <div class="welcome">
          <div class="logo">✦</div>
          <h1>Welcome to StudySpot! 👋</h1>
<h1>Welcome to StudySpot! 👋</h1>

<p>
Мен StudySpot AI көмекшісімін.
Аудитория, кітапхана және оқу орындарын
брондау туралы кез келген сұрағыңды қоя аласың.
</p>
 
        </div>
      </section>

      <form id="chatForm">
        <textarea
          id="userInput"
          placeholder="Хабарлама жаз..."
          rows="1"
          required
        ></textarea>
        <button type="submit" id="sendBtn">↑</button>
      </form>

      <small>AI кейде қате жауап беруі мүмкін.</small>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
